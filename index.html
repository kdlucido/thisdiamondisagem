    .quote-carousel-track {
      display: flex;

      width: max-content;
      animation: scrollQuotes 60s linear infinite;
      padding: 10px 0;
    }

    .quote-carousel-track:hover {
      animation-play-state: paused;
    }

    .quote-card {
      width: 360px;
      min-width: 360px;
      max-width: 360px;

      0% {

      position: relative;

      z-index: 1;
    }

      list-style: none;
      cursor: default;
      display: flex;

      min-height: 54px;
      padding: 10px 7px;
      box-sizing: border-box;
      color: #1f4d3a;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      line-height: 1.3;
      overflow-wrap: anywhere;
    }

    .supporter-card summary::-webkit-details-marker {
      display: none;
    }

    .supporter-card:hover,
    .supporter-card:focus-within {
      border-color: #1f4d3a;
      z-index: 10;
